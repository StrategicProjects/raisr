url: https://strategicprojects.github.io/raisr/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#1f4e79"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  includes:
    in_header: pkgdown/extra.css

home:
  title: "raisr: RAIS microdata from R"
  description: >
    List, download and stream-read the annual RAIS microdata of the
    Brazilian Ministry of Labour and Employment, filtering by state before
    anything is kept in memory.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: Getting started
          href: articles/getting-started.html
        - text: Streaming, cache and file generations
          href: articles/streaming-and-cache.html

reference:
  - title: "Server"
    desc: "What is published, and which archive holds a state."
    contents:
      - rais_available
      - rais_files
      - rais_ufs

  - title: "Download and cache"
    contents:
      - rais_download
      - rais_cache_dir
      - rais_cache_list
      - rais_cache_clear

  - title: "Read"
    desc: "Stream-read the archives, filtering by state."
    contents:
      - rais_read
      - rais_fetch

  - title: "Consolidate and document"
    contents:
      - rais_stock
      - rais_layout
      - raisr-package

footer:
  structure:
    left: developed_by
    right: built_with
