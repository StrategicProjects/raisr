    <g fill="#5cc8a8">
      <rect x="72"  y="118" width="22" height="78" rx="3"/>
      <rect x="112" y="104" width="22" height="92" rx="3"/>
      <rect x="152" y="124" width="22" height="72" rx="3"/>
      <rect x="192" y="90"  width="22" height="106" rx="3"/>
      <rect x="232" y="76"  width="22" height="120" rx="3"/>
    </g>
    <g fill="#f28f3b">
      <rect x="72"  y="92"  width="22" height="24" rx="3"/>
      <rect x="112" y="76"  width="22" height="26" rx="3"/>
      <rect x="152" y="100" width="22" height="22" rx="3"/>
      <rect x="192" y="62"  width="22" height="26" rx="3"/>
      <rect x="232" y="46"  width="22" height="28" rx="3"/>
