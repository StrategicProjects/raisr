    <!-- mean wage line -->
    <polyline points="83,150 123,134 163,146 203,118 243,100" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#ffffff">
      <circle cx="83" cy="150" r="5"/><circle cx="123" cy="134" r="5"/><circle cx="163" cy="146" r="5"/>
      <circle cx="203" cy="118" r="5"/><circle cx="243" cy="100" r="5"/>
