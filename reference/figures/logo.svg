  <polygon points="158,4 312,92 312,272 158,360 4,272 4,92" fill="none" stroke="#0b2540" stroke-width="6"/>
  <text x="158" y="268" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">raisr</text>
  <text x="158" y="294" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc5e8" letter-spacing="1.5">RAIS · MTE</text>
